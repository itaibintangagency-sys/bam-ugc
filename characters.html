<body>

    </button>

<!-- ══════════════ MAIN ══════════════ -->
<main>
  <div class="topline">
    <div>
      <div class="greet">Character library</div>
      <h1>Karakter</h1>
    </div>
    <button class="btn btn-primary" onclick="openCreator()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Karakter baru
    </button>
  </div>

  <div class="card-grid" id="charGrid"></div>
</main>

<!-- ══════════════ DETAIL MODAL ══════════════ -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="detailName">—</div>
      <button class="modal-close" onclick="closeModal('detailModal')">✕</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-foot">
      <button class="btn btn-danger-ghost" id="detailDeactivate">Nonaktifkan</button>
      <a href="video-studio.html" class="btn btn-primary" id="detailUse">Pakai di video baru</a>
    </div>
  </div>
</div>

<!-- ══════════════ CHARACTER CREATOR (game-style, step by step) ══════════════ -->
<div class="modal-overlay" id="creatorModal">
  <div class="modal" style="max-width:600px">
    <div class="modal-head">
      <div class="modal-title">Karakter baru</div>
      <button class="modal-close" onclick="closeModal('creatorModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="stepper" id="creatorStepper" style="margin-bottom:22px"></div>
      <div id="creatorStepBody"></div>
    </div>
    <div class="modal-foot" style="justify-content:space-between">
      <button class="btn btn-ghost" id="creatorBack">Kembali</button>
      <button class="btn btn-primary" id="creatorNext">Lanjut</button>
    </div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  let charList = [];
  const STATUS_LABELS = {
    draft: 'Draft', collecting_photos: 'Mengumpulkan foto', avatar_processing: 'Memproses avatar',
    avatar_ready: 'Avatar siap', voice_ready: 'Suara siap', complete: 'Lengkap', abandoned: 'Dibatalkan',
  };

  async function renderChars() {
    const grid = document.getElementById('charGrid');
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">Memuat karakter…</div>`;
    try {
      charList = await DB.getCharacters();
    } catch (err) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><strong>Gagal memuat karakter</strong>${escapeHtml(err.message)}</div>`;
      return;
    }
    const photos = await Promise.all(charList.map(c => c.reference_photo_url ? Promise.resolve(c.reference_photo_url) : DB.getCharacterPrimaryPhoto(c.id).catch(() => null)));
    grid.innerHTML = charList.map((c, i) => `
      <div class="tile" onclick="openDetail('${c.id}')">
        <div class="tile-media">${photos[i] ? `<img src="${photos[i]}" alt="${escapeHtml(c.name)}"/>` : c.name.charAt(0)}<span class="tile-badge">${escapeHtml(STATUS_LABELS[c.status] || c.status || '—')}</span></div>
        <div class="tile-body">
          <div class="tile-title">${escapeHtml(c.name)}</div>
          <div class="tile-sub">${c.photos_count || 0} foto</div>
        </div>
      </div>`).join('') + `
      <div class="tile tile-add" onclick="openCreator()" style="aspect-ratio:auto">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>Karakter baru</span>
      </div>`;
  }
  renderChars();

  async function openDetail(id) {
    let c;
    try { c = await DB.getCharacter(id); } catch (err) { return toast('Gagal memuat: ' + err.message); }
    if (!c) return;
    document.getElementById('detailName').textContent = c.name;
    const photo = c.reference_photo_url || await DB.getCharacterPrimaryPhoto(id).catch(() => null);
    document.getElementById('detailBody').innerHTML = `
      ${photo ? `<img src="${photo}" alt="${escapeHtml(c.name)}" style="width:100%;max-width:220px;border-radius:10px;margin-bottom:14px;display:block"/>` : ''}
      <div class="field-row">
        <div><div class="field-hint">Status</div><div style="font-weight:600;margin-top:2px">${escapeHtml(STATUS_LABELS[c.status] || c.status || '—')}</div></div>
        <div><div class="field-hint">Gaya konten</div><div style="font-weight:600;margin-top:2px">${escapeHtml(c.style || '—')}</div></div>
      </div>
      <div class="field-row" style="margin-top:14px">
        <div><div class="field-hint">Foto terkumpul</div><div style="font-weight:600;margin-top:2px">${c.photos_count || 0}</div></div>
        <div><div class="field-hint">Suara</div><div style="font-weight:600;margin-top:2px">${c.voice_id ? 'Sudah ada' : '—'}</div></div>
      </div>
      ${c.notes ? `<div style="margin-top:14px"><div class="field-hint">Catatan</div><div style="font-weight:600;margin-top:2px">${escapeHtml(c.notes)}</div></div>` : ''}`;
    document.getElementById('detailUse').href = 'video-studio.html?character=' + c.id;
    const readyForVideo = ['avatar_ready', 'voice_ready', 'complete'].includes(c.status);
    document.getElementById('detailUse').style.opacity = readyForVideo ? '1' : '.5';
    document.getElementById('detailUse').title = readyForVideo ? '' : 'Avatar karakter ini belum siap, tapi tetap bisa dicoba untuk prototype';
    document.getElementById('detailDeactivate').onclick = () => { toast('Nonaktifkan karakter belum tersambung ke database — perlu ditambahkan terpisah.'); };
    openModal('detailModal');
  }

  // ── Character creator wizard ──────────────────────────────
  // CATATAN: alur asli pembuatan karakter di sistem ini berbasis pengumpulan
  // foto bertahap (status: draft → collecting_photos → avatar_processing →
  // avatar_ready → voice_ready → complete), bukan generate instan dari preset.
  // Wizard di bawah ini masih murni untuk PRATINJAU alur — langkah terakhir
  // sengaja TIDAK menulis apa pun ke database sampai alur aslinya didesain ulang.
  const creatorSteps = ['Gender', 'Wajah & tubuh', 'Gaya & suara', 'Nama'];
  const options = {
    gender: ['Perempuan', 'Laki-laki'],
    face: ['Oval', 'Bulat', 'Persegi', 'Hati'],
    body: ['Ramping', 'Atletis', 'Berisi'],
    hair: ['Berhijab', 'Rambut panjang', 'Rambut pendek', 'Rambut ikal'],
    style: ['Review', 'Viral', 'Storytelling'],
    personality: ['Hangat & ramah', 'Energik & cepat', 'Tenang & jelas', 'Jenaka'],
    voice: ['Hangat & ramah', 'Energik & cepat', 'Tenang & jelas', 'Ceria'],
  };
  let creatorState = {};
  let creatorStep = 0;

  function openCreator() {
    creatorState = { gender: null, face: null, body: null, hair: null, style: null, voice: null, name: '' };
    creatorStep = 0;
    renderCreator();
    openModal('creatorModal');
  }

  function chip(group, value, current) {
    return `<button type="button" class="chip ${current === value ? 'active' : ''}" onclick="pickChip('${group}','${value.replace(/'/g,"\\'")}')">${escapeHtml(value)}</button>`;
  }
  function pickChip(group, value) { creatorState[group] = value; renderCreator(); }

  function renderCreator() {
    document.getElementById('creatorStepper').innerHTML = creatorSteps.map((label, i) => `
      <div class="step-pt ${i < creatorStep ? 'done' : i === creatorStep ? 'active' : ''}">
        <div class="step-dot">${i < creatorStep ? '✓' : i + 1}</div>
        <div class="step-label">${label}</div>
      </div>${i < creatorSteps.length - 1 ? '<div class="step-line"></div>' : ''}`).join('');

    const body = document.getElementById('creatorStepBody');
    if (creatorStep === 0) {
      body.innerHTML = `<div class="field"><label>Pilih gender karakter</label><div class="chip-group">${options.gender.map(v => chip('gender', v, creatorState.gender)).join('')}</div></div>`;
    } else if (creatorStep === 1) {
      body.innerHTML = `
        <div class="field"><label>Bentuk wajah</label><div class="chip-group">${options.face.map(v => chip('face', v, creatorState.face)).join('')}</div></div>
        <div class="field"><label>Bentuk tubuh</label><div class="chip-group">${options.body.map(v => chip('body', v, creatorState.body)).join('')}</div></div>
        <div class="field"><label>Rambut / hijab</label><div class="chip-group">${options.hair.map(v => chip('hair', v, creatorState.hair)).join('')}</div></div>`;
    } else if (creatorStep === 2) {
      body.innerHTML = `
        <div class="field"><label>Gaya konten</label><div class="chip-group">${options.style.map(v => chip('style', v, creatorState.style)).join('')}</div></div>
        <div class="field"><label>Suara (preview sebelum pilih)</label><div class="chip-group">${options.voice.map(v => `
          <button type="button" class="chip ${creatorState.voice === v ? 'active' : ''}" onclick="pickChip('voice','${v}')">🔊 ${escapeHtml(v)}</button>`).join('')}</div></div>`;
    } else if (creatorStep === 3) {
      body.innerHTML = `
        <div class="field"><label for="charNameInput">Nama karakter</label><input type="text" id="charNameInput" placeholder="mis. Dinda" value="${escapeHtml(creatorState.name || '')}"/></div>
        <div class="field-hint" style="color:var(--coral)">⚠️ Langkah ini masih pratinjau — belum tersambung ke database. Karakter asli dibuat lewat pengumpulan foto bertahap (lihat status di kartu karakter).</div>`;
    }
    document.getElementById('creatorBack').style.visibility = creatorStep === 0 ? 'hidden' : 'visible';
    document.getElementById('creatorNext').textContent = creatorStep === creatorSteps.length - 1 ? 'Selesai (pratinjau)' : 'Lanjut';
  }

  document.getElementById('creatorBack').addEventListener('click', () => { if (creatorStep > 0) { creatorStep--; renderCreator(); } });
  document.getElementById('creatorNext').addEventListener('click', () => {
    if (creatorStep === 0 && !creatorState.gender) return toast('Pilih gender dulu.');
    if (creatorStep === 1 && (!creatorState.face || !creatorState.body || !creatorState.hair)) return toast('Lengkapi bentuk wajah, tubuh, dan rambut.');
    if (creatorStep === 2 && (!creatorState.style || !creatorState.voice)) return toast('Pilih gaya konten dan suara.');

    if (creatorStep < creatorSteps.length - 1) { creatorStep++; renderCreator(); return; }

    const name = document.getElementById('charNameInput').value.trim();
    if (!name) return toast('Isi nama karakter dulu.');
    closeModal('creatorModal');
    toast('Pratinjau selesai — pembuatan karakter sungguhan menyusul setelah alur collecting_photos didesain ulang.');
  });

  // deep-link #new dari halaman lain
  if (window.location.hash === '#new') openCreator();

  (async () => {
    await AUTH.guard();
    document.getElementById('acctBtn').addEventListener('click', () => { if (confirm('Keluar dari BA UGC?')) AUTH.signOut(); });
  })();
</script>
</body>
</html>
