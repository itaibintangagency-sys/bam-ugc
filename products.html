<head>

<link rel="stylesheet" href="css/style.css"/>

</head>

      Dashboard
    </a>
    <a href="characters.html" class="nav-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      Karakter
    </a>
    <a href="products.html" class="nav-item active">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></svg>
      Produk
    </a>
    <a href="video-studio.html" class="nav-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="15" height="14" rx="2"/><path d="M17 9l5-3v12l-5-3"/></svg>
      Video Studio
    </a>
    <div class="nav-section-gap"></div>
    <a href="history.html" class="nav-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      Riwayat
    </a>
    <a href="staff.html" class="nav-item" data-admin-only>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Staff

  <div class="sidebar-foot">
    <a href="profile.html" class="acct" style="text-decoration:none">
      <div class="acct-avatar" data-acct-avatar>P</div>
      <div><div class="acct-name" data-acct-name>Patrik</div><div class="acct-role" data-acct-role>Admin</div></div>
    </a>
  </div>
</aside>

<main>
  <div class="topline">
    <div>
      <div class="greet">Product library</div>
      <h1>Produk</h1>
    </div>
    <button class="btn btn-primary" onclick="openModal('addProductModal')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Produk baru
    </button>
  </div>

  <div class="filter-bar">
    <input type="search" id="searchInput" placeholder="Cari produk…"/>
    <select id="platformFilter">
      <option value="">Semua platform</option>
      <option value="shopee">Shopee</option>
      <option value="tiktok">TikTok Shop</option>
      <option value="tokopedia">Tokopedia</option>
      <option value="manual">Manual</option>
    </select>
  </div>

  <div class="card-grid" id="productGrid"></div>
</main>

<!-- ADD PRODUCT MODAL -->
<div class="modal-overlay" id="addProductModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">Produk baru</div>
      <button class="modal-close" onclick="closeModal('addProductModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="scrapeUrl">Tempel link produk (Shopee / TikTok Shop)</label>
        <input type="url" id="scrapeUrl" placeholder="https://…"/>
        <div class="field-hint">Klik "Ambil data" — AI akan isi otomatis nama, harga, dan kategori. Atau isi manual di bawah.</div>
      </div>
      <button type="button" class="btn btn-ghost" style="margin-bottom:18px" id="scrapeBtn">Ambil data dari link</button>

      <div class="field">
        <label for="prodName">Nama produk</label>
        <input type="text" id="prodName" placeholder="mis. Serum Wajah Glow-C"/>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="prodPlatform">Platform</label>
          <select id="prodPlatform">
            <option value="shopee">Shopee</option>
            <option value="tiktok">TikTok Shop</option>
            <option value="tokopedia">Tokopedia</option>
            <option value="manual">Manual</option>
          </select>
        </div>
        <div class="field">
          <label for="prodPrice">Harga</label>
          <input type="text" id="prodPrice" placeholder="mis. Rp89.000"/>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal('addProductModal')">Batal</button>
      <button class="btn btn-primary" id="saveProductBtn">Simpan produk</button>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="prodDetailModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="prodDetailName">—</div>
      <button class="modal-close" onclick="closeModal('prodDetailModal')">✕</button>
    </div>
    <div class="modal-body" id="prodDetailBody"></div>
    <div class="modal-foot">
      <a href="video-studio.html" class="btn btn-primary" id="prodDetailUse">Pakai di video baru</a>
    </div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  async function renderProducts() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const platform = document.getElementById('platformFilter').value;
    const grid = document.getElementById('productGrid');
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">Memuat produk…</div>`;
    let list;
    try {
      list = await DB.getProducts();
    } catch (err) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><strong>Gagal memuat produk</strong>${escapeHtml(err.message)}</div>`;
      return;
    }
    if (q) list = list.filter(p => p.name.toLowerCase().includes(q));
    if (platform) list = list.filter(p => p.platform === platform);

    if (!list.length) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><strong>Belum ada produk</strong>Tambah produk pertama untuk mulai generate video.</div>`;
      return;
    }
    grid.innerHTML = list.map(p => `
      <div class="tile" onclick="openProdDetail('${p.id}')">
        <div class="tile-media">${p.name.charAt(0)}<span class="tile-badge">${escapeHtml(platformLabel(p.platform))}</span></div>
        <div class="tile-body">
          <div class="tile-title">${escapeHtml(p.name)}</div>
          <div class="tile-sub">${escapeHtml(p.price || '')}</div>
        </div>
      </div>`).join('');
  }
  const PLATFORM_LABELS = { shopee: 'Shopee', tiktok: 'TikTok Shop', tokopedia: 'Tokopedia', manual: 'Manual' };
  function platformLabel(v) { return PLATFORM_LABELS[v] || v; }

  renderProducts();
  document.getElementById('searchInput').addEventListener('input', renderProducts);
  document.getElementById('platformFilter').addEventListener('change', renderProducts);

  async function openProdDetail(id) {
    let p;
    try { p = await DB.getProduct(id); } catch (err) { return toast('Gagal memuat produk: ' + err.message); }
    if (!p) return;
    document.getElementById('prodDetailName').textContent = p.name;
    document.getElementById('prodDetailBody').innerHTML = `
      <div class="field-row">
        <div><div class="field-hint">Platform</div><div style="font-weight:600;margin-top:2px">${escapeHtml(platformLabel(p.platform))}</div></div>
        <div><div class="field-hint">Harga</div><div style="font-weight:600;margin-top:2px">${escapeHtml(p.price || '—')}</div></div>
      </div>
      <div style="margin-top:14px"><div class="field-hint">Deskripsi</div><div style="font-weight:600;margin-top:2px">${escapeHtml(p.description || '—')}</div></div>`;
    document.getElementById('prodDetailUse').href = 'video-studio.html?product=' + p.id;
    openModal('prodDetailModal');
  }

  document.getElementById('scrapeBtn').addEventListener('click', () => {
    const url = document.getElementById('scrapeUrl').value.trim();
    if (!url) return toast('Tempel link produk dulu.');
    const btn = document.getElementById('scrapeBtn');
    btn.disabled = true; btn.textContent = 'Mengambil data…';
    setTimeout(() => {
      const guessPlatform = url.includes('shopee') ? 'shopee' : url.includes('tokopedia') ? 'tokopedia' : 'tiktok';
      document.getElementById('prodName').value = 'Produk dari ' + platformLabel(guessPlatform);
      document.getElementById('prodPlatform').value = guessPlatform;
      document.getElementById('prodPrice').value = 'Rp' + (Math.floor(Math.random() * 150 + 20) * 1000).toLocaleString('id-ID');
      btn.disabled = false; btn.textContent = 'Ambil data dari link';
      toast('Data produk terisi otomatis — cek & sesuaikan sebelum simpan.');
    }, 1100);
  });

  document.getElementById('saveProductBtn').addEventListener('click', async () => {
    const name = document.getElementById('prodName').value.trim();
    if (!name) return toast('Nama produk wajib diisi.');
    const btn = document.getElementById('saveProductBtn');
    btn.disabled = true; btn.textContent = 'Menyimpan…';
    try {
      await DB.addProduct({
        name,
        url: document.getElementById('scrapeUrl').value.trim() || null,
        platform: document.getElementById('prodPlatform').value,
        price: document.getElementById('prodPrice').value.trim(),
      });
      closeModal('addProductModal');
      ['prodName','prodPrice','scrapeUrl'].forEach(id => document.getElementById(id).value = '');
      await renderProducts();
      toast(`${name} ditambahkan ke library.`);
    } catch (err) {
      toast('Gagal simpan: ' + err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'Simpan produk';
    }
  });

  (async () => {
    await AUTH.guard();
  })();
</script>
</body>
</html>
