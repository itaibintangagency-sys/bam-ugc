<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Masuk — BA UGC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-mark">BA<span>UGC</span></div>
    <div class="auth-sub">Masuk untuk mulai generate video.</div>

    <div class="auth-error" id="authError"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nama@bintangagency.id" required autocomplete="username"/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px" id="loginBtn">Masuk</button>
    </form>

    <div class="auth-foot" id="modeNote">Mode prototype aktif — isi email &amp; password apa saja untuk masuk. Sambungkan Supabase di <code>js/supabase-client.js</code> untuk login sungguhan.</div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  (async () => {
    // kalau sudah login, langsung lempar ke dashboard
    const existing = await AUTH.getUser();
    if (existing) window.location.href = 'dashboard.html';
    if (typeof SUPABASE_READY !== 'undefined' && SUPABASE_READY) {
      document.getElementById('modeNote').textContent = 'Login memakai Supabase Auth.';
    }
  })();

  const form = document.getElementById('loginForm');
  const errEl = document.getElementById('authError');
  const btn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Memproses…';
    try {
      await AUTH.signIn(document.getElementById('email').value.trim(), document.getElementById('password').value);
      window.location.href = 'dashboard.html';
    } catch (err) {
      errEl.textContent = err.message || 'Gagal masuk. Coba lagi.';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Masuk';
    }
  });
</script>
</body>
</html>
