    <a href="characters.html" class="nav-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      Karakter

    <a href="products.html" class="nav-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></svg>
      Produk

    <a href="video-studio.html" class="nav-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="15" height="14" rx="2"/><path d="M17 9l5-3v12l-5-3"/></svg>
      Video Studio
    </a>
    <div class="nav-section-gap"></div>
    <a href="history.html" class="nav-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      Riwayat
    </a>
    <a href="staff.html" class="nav-item active" data-admin-only>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Staff
    </a>
  </nav>
  <div class="sidebar-foot">
    <a href="profile.html" class="acct" style="text-decoration:none">
      <div class="acct-avatar" data-acct-avatar>P</div>
      <div><div class="acct-name" data-acct-name>Patrik</div><div class="acct-role" data-acct-role>Admin</div></div>
    </a>
  </div>
</aside>

<main>
  <div class="topline">
    <div>
      <div class="greet">Admin</div>
      <h1>Kelola Staff</h1>
    </div>
    <button class="btn btn-primary" id="addStaffBtn">+ Tambah Staff</button>
  </div>

  <!-- Form tambah staff (tersembunyi sampai tombol di atas diklik) -->
  <div class="wizard-panel" id="addStaffPanel" style="display:none;max-width:440px">
    <div class="block-title" style="margin-bottom:14px">Akun staff baru</div>
    <input type="text" id="newName" class="field-input" style="width:100%;margin-bottom:10px" placeholder="Nama"/>
    <input type="email" id="newEmail" class="field-input" style="width:100%;margin-bottom:10px" placeholder="Email"/>
    <input type="password" id="newPass" class="field-input" style="width:100%;margin-bottom:18px" placeholder="Password sementara (min. 8 karakter)"/>
    <div style="display:flex;gap:10px">
      <button class="btn btn-primary" id="submitStaffBtn">Buat akun</button>
      <button class="btn btn-ghost" id="cancelStaffBtn">Batal</button>
    </div>
    <div class="field-hint" style="margin-top:12px">Staff bisa ganti password sendiri lewat halaman Profil setelah login pertama kali.</div>
  </div>

  <div class="wizard-panel">
    <div class="block-title" style="margin-bottom:14px">Daftar staff</div>
    <div id="staffList">Memuat…</div>
  </div>
</main>

<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('addStaffBtn').addEventListener('click', () => {
    document.getElementById('addStaffPanel').style.display = '';
  });
  document.getElementById('cancelStaffBtn').addEventListener('click', () => {
    document.getElementById('addStaffPanel').style.display = 'none';
  });

  document.getElementById('submitStaffBtn').addEventListener('click', async () => {
    const name = document.getElementById('newName').value.trim();
    const email = document.getElementById('newEmail').value.trim();
    const password = document.getElementById('newPass').value;
    if (!name || !email) return toast('Nama dan email wajib diisi.');
    if (password.length < 8) return toast('Password minimal 8 karakter.');

    const btn = document.getElementById('submitStaffBtn');
    btn.disabled = true; btn.textContent = 'Membuat akun…';
    try {
      await DB.createStaff({ email, password, name });
      toast(`Akun untuk ${name} berhasil dibuat.`);
      document.getElementById('newName').value = '';
      document.getElementById('newEmail').value = '';
      document.getElementById('newPass').value = '';
      document.getElementById('addStaffPanel').style.display = 'none';
      await loadStaffList();
    } catch (err) {
      toast('Gagal buat akun: ' + err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'Buat akun';
    }
  });

  async function loadStaffList() {
    const el = document.getElementById('staffList');
    try {
      const staff = await DB.getStaffList();
      if (!staff.length) { el.innerHTML = '<div class="field-hint">Belum ada staff.</div>'; return; }
      el.innerHTML = `
        <div class="frame-list">
          ${staff.map(s => `
            <div class="frame-card">
              <div class="frame-thumb">${(s.name || s.email || '?').charAt(0).toUpperCase()}</div>
              <div class="frame-body">
                <div class="frame-label"><span>${escapeHtml(s.name || '(tanpa nama)')}</span><span class="act-status ${s.role === 'admin' ? 'st-complete' : 'st-draft'}">${s.role === 'admin' ? 'Admin' : 'Staff'}</span></div>
                <div class="frame-script">${escapeHtml(s.email)}</div>
              </div>
            </div>`).join('')}
        </div>`;
    } catch (err) {
      el.innerHTML = `<div class="field-hint">Gagal memuat daftar staff: ${escapeHtml(err.message)}</div>`;
    }
  }

  (async () => {
    const user = await AUTH.guardAdmin(); // halaman ini khusus admin, redirect kalau staff
    if (!user) return;
    document.getElementById('acctBtn') && document.getElementById('acctBtn').addEventListener('click', () => { if (confirm('Keluar dari BA UGC?')) AUTH.signOut(); });
    await loadStaffList();
  })();
</script>
</body>
</html>
