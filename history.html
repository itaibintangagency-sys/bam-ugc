<main>
  <div class="topline">
    <div>
      <div class="greet">Semua video</div>
      <h1>Riwayat</h1>
    </div>
    <a href="video-studio.html" class="btn btn-primary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Video baru
    </a>
  </div>

  <div class="filter-bar">
    <input type="search" id="searchInput" placeholder="Cari judul video…"/>
    <select id="statusFilter">
      <option value="">Semua status</option>
      <option value="analyzing">Menganalisis</option>
      <option value="scripting">Menulis script</option>
      <option value="generating_audio">Generate audio</option>
      <option value="generating_video">Generate video</option>
      <option value="completed">Selesai</option>
      <option value="failed">Gagal</option>
    </select>
  </div>

  <div class="activity">
    <div id="historyList"></div>
  </div>
</main>

<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const statusMap = {
    analyzing: ['Menganalisis', 'st-draft'],
    scripting: ['Menulis script', 'st-review'],
    generating_audio: ['Generate audio', 'st-generating'],
    generating_video: ['Generate video', 'st-generating'],
    completed: ['Selesai', 'st-complete'],
    failed: ['Gagal', 'st-failed'],
  };

  async function renderHistory() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const status = document.getElementById('statusFilter').value;
    const el = document.getElementById('historyList');
    el.innerHTML = `<div class="empty">Memuat riwayat…</div>`;
    let jobs;
    try {
      jobs = await DB.getVideoJobs();
    } catch (err) {
      el.innerHTML = `<div class="empty"><strong>Gagal memuat riwayat</strong>${escapeHtml(err.message)}</div>`;
      return;
    }
    if (q) jobs = jobs.filter(j => j.title.toLowerCase().includes(q));
    if (status) jobs = jobs.filter(j => j.status === status);

    if (!jobs.length) {
      el.innerHTML = `<div class="empty"><strong>Belum ada video</strong>Mulai produksi pertama dari Video Studio.</div>`;
      return;
    }
    el.innerHTML = jobs.map(j => {
      const [label, cls] = statusMap[j.status] || statusMap.analyzing;
      return `
      <a href="video-studio.html?job=${j.id}" class="act-row clickable">
        <div class="act-thumb"></div>
        <div class="act-main">
          <div class="act-title">${escapeHtml(j.title)}</div>
          <div class="act-meta">${j.frames_count || 0} scene · langkah ${j.current_step || 1}/4</div>
        </div>
        <span class="act-status ${cls}">${label}</span>
        <span class="act-time">${timeAgo(new Date(j.created_at).getTime())}</span>
      </a>`;
    }).join('');
  }
  renderHistory();
  document.getElementById('searchInput').addEventListener('input', renderHistory);
  document.getElementById('statusFilter').addEventListener('change', renderHistory);

  (async () => {
    await AUTH.guard();
  })();
</script>
</body>
</html>
