<!doctype html>
<html><head><meta charset="utf-8"><title>mockflow</title>
<style>
  body { background:#000; color:#fff; font-family:sans-serif; margin:0; }
  .grid { display:flex; flex-wrap:wrap; gap:10px; padding:90px 16px 200px; }
  .card { width:140px; height:250px; background:#222; position:relative; overflow:hidden; font-size:11px; }
  .card img { width:100%; height:100%; object-fit:cover; cursor:pointer; }
  .footer-left { position:absolute; bottom:4px; left:6px; }
  .composer { position:fixed; left:160px; bottom:20px; width:560px; background:#1a1a1a; padding:10px; border-radius:12px; }
  #ed { min-height:20px; border:1px solid #444; white-space:pre-wrap; max-height:120px; overflow:auto; }
  #pop { display:none; position:fixed; top:40px; left:420px; width:300px; background:#222; padding:8px; z-index:5; }
  #pop.open { display:block; }
  #panel { display:none; position:fixed; inset:0; background:#202124; z-index:10; }
  #detail { display:none; position:fixed; inset:0; background:#000; z-index:8; }
  #menu { position:absolute; right:20px; top:60px; background:#222; display:none; }
  #menu.open { display:block; } #sub { display:none; position:absolute; right:200px; top:40px; background:#2a2a2a; } #sub.open { display:block; }
  button { color:#000; margin:2px; }
  #cap { position:fixed; inset:0; background:rgba(255,255,255,.6); z-index:20; }
</style></head><body>
<div id="home" style="display:none;padding:80px"><h1>Google Flow</h1><button id="newproj">Project baru</button></div>
<div id="project">
  <div style="position:fixed;top:10px;left:10px;z-index:3">
    <button aria-label="Beranda">home</button><input aria-label="Teks yang dapat diedit" value="Okt 01 - 18:25"/>
    <button aria-label="Opsi lainnya untuk project">more_vert</button>
    <button aria-label="Menu tambahkan media">add</button><span id="extra"></span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="composer">
    <div id="chips"></div>
    <div contenteditable="true" id="ed"></div>
    <button type="button" aria-label="Hapus perintah" id="clr">close</button>
    <button type="button" aria-label="Tambahkan bahan ke kotak perintah" id="plus">add</button>
    <button aria-pressed="false" id="agentbtn" onclick="this.setAttribute('aria-pressed', this.getAttribute('aria-pressed')==='true'?'false':'true')">Agen</button>
    <button aria-label="Pemicu setelan" id="chip"><span id="chiptxt">Video · 360p · 8 dtk</span><span>crop_16_9</span><span id="chipn">x2</span></button>
    <button type="submit" aria-label="Mulai pembuatan" id="gen">arrow_forward</button>
  </div>
</div>

<div id="detail">
  <button aria-label="Tombol kembali untuk membuka halaman sebelumnya" id="back">arrow_back</button>
  <button aria-label="Opsi lainnya" id="more">more_vert</button>
  <video class="main-video" aria-label="Video yang dihasilkan" width="224" height="399" muted></video>
  <button aria-label="Gunakan kembali perintah">keyboard_return</button>
  <div id="menu">
    <button role="menuitem" id="m-fav">favorite<br>Favorit</button><br>
    <button role="menuitem" id="m-share">share<br>Bagikan media</button><br>
    <button role="menuitem" id="m-dl">download<br>Download media</button><br>
    <button role="menuitem" id="m-del">delete<br>Pindahkan ke sampah</button>
  </div>
  <div id="sub">
    <button role="menuitem">270p<br>GIF Animasi</button><br>
    <button role="menuitem" id="orig">360p<br>Ukuran asli</button><br>
    <button role="menuitem" id="up">720p<br>Resolusi ditingkatkan</button><a href="#" id="upg">Upgrade</a>
  </div>
</div>

<div id="pop">
  <div><button role="radio" aria-checked="false" data-g="mode"><i>image</i>Gambar</button><button role="radio" aria-checked="true" data-g="mode"><i>videocam</i>Video</button></div>
  <div><button role="radio" aria-checked="false" data-g="sub"><i>crop_free</i>Frame</button><button role="radio" aria-checked="true" data-g="sub"><i>chrome_extension</i>Bahan</button></div>
  <div><button role="radio" aria-checked="true" data-g="ratio"><i>crop_16_9</i>16:9</button><button role="radio" aria-checked="false" data-g="ratio"><i>crop_9_16</i>9:16</button></div>
  <button aria-label="Pilih rangkaian model" id="model">Omni 1.1 Flash<i>arrow_drop_down</i></button>
  <div><button role="radio" aria-checked="true" data-g="res">360p</button><button role="radio" aria-checked="false" data-g="res">720p</button></div>
  <div><button role="radio" aria-checked="false" data-g="dur">4 dtk</button><button role="radio" aria-checked="false" data-g="dur">6 dtk</button><button role="radio" aria-checked="true" data-g="dur">8 dtk</button><button role="radio" aria-checked="false" data-g="dur">10 dtk</button></div>
  <div><button role="radio" aria-checked="false" data-g="n">x1</button><button role="radio" aria-checked="true" data-g="n">x2</button><button role="radio" aria-checked="false" data-g="n">x3</button><button role="radio" aria-checked="false" data-g="n">x4</button></div>
  <p>Pembuatan akan menggunakan <a href="#" id="cred">12 kredit</a></p>
</div>

<div id="panel">
  <button aria-label="Tutup" id="pclose">close</button>
  <input aria-label="Telusuri aset" id="psearch" placeholder="Telusuri aset" style="width:300px"><button aria-label="Upload media" id="upl">upload</button>
  <div role="listbox" aria-label="Daftar aset" id="assets"></div>
</div>
<input type="file" id="f" style="display:none">

<script>
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const LANG = P.get('lang') === 'en' ? 'en' : 'id';
const LG = LANG === 'en'
  ? { thumbAlt: 'Generated video thumbnail', failWord: 'Failed', failMsg: 'This prompt may violate our policy on sexual content. Try another prompt or send feedback. You do not need to use credits for this generation.', credits: 'credits', uploading: 'Uploading', character: 'Character', gif: 'Animated GIF', orig: 'Original size', upsc: 'Upscaled' }
  : { thumbAlt: 'Thumbnail video yang dihasilkan', failWord: 'Gagal', failMsg: 'Perintah ini mungkin melanggar kebijakan kami tentang pembuatan konten seksual. Coba perintah lain atau kirim masukan. Anda tidak perlu menggunakan kredit untuk pembuatan ini.', credits: 'kredit', uploading: 'Mengupload', character: 'Karakter', gif: 'GIF Animasi', orig: 'Ukuran asli', upsc: 'Resolusi ditingkatkan' };
const FAILN = Number(P.get('fail') || 0), DELAY = Number(P.get('delay') || 700);
let cards = [], chips = [], gc = 0, finishCount = 0, vidCount = 0, assetN = 0, mentionMode = false;
const CHARACTERS = (P.get('chars') || 'Sari,Dewi').split(',').filter(Boolean);
window.__mentions = []; window.__lastGen = null; window.__projectsCreated = 0;
window.__downloads = 0; window.__forbidden = 0; window.__generated = 0;

const img = c => 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='140' height='250'><rect width='140' height='250' fill='${c}'/></svg>`);
cards = [{ type: 'video', id: 'v0', src: img('#445566'), title: 'Video lama' }, { type: 'user', id: 'u0', src: img('#665544'), title: 'lama.png' }];
if (P.get('extra') === '1') $('extra').innerHTML = '<button aria-label="Tombol baru">new</button>';
if (P.get('nochip') === '1') $('chip').style.display = 'none';

function renderGrid() {
  $('grid').innerHTML = '';
  for (const c of cards) {
    const d = document.createElement('div'); d.className = 'card';
    if (c.type === 'video') {
      d.innerHTML = `<img class="thumbnail" alt="${LG.thumbAlt}" src="${c.src}"><div class="footer-left" role="button">play_circle<br>${c.title}</div>`;
      d.querySelector('img').onclick = () => { location.hash = '#/edit/' + c.id; };
    } else if (c.type === 'user') {
      d.innerHTML = `<img class="image" alt="Kartu yang menampilkan gambar pengguna" src="${c.src}"><div class="footer-left" role="button">image<br>${c.title}</div>`;
    } else if (c.type === 'proc') {
      d.innerHTML = `<div style="height:200px;background:#333"></div><div class="footer-left">{ "project": {...</div><button aria-label="Gunakan kembali perintah">keyboard_return</button>`;
    } else if (c.type === 'fail') {
      d.innerHTML = `<div>⚠</div><div>${LG.failWord}</div><p>${c.msg}</p><button class="rt">refresh</button><button>undo</button><button>delete</button>`;
      d.querySelector('.rt').onclick = () => { c.type = 'proc'; renderGrid(); setTimeout(() => finish(c.id), DELAY); };
    }
    $('grid').appendChild(d);
  }
}
function renderChips() {
  $('chips').innerHTML = '';
  for (const c of chips) { const b = document.createElement('button'); b.className = 'chip-container'; b.setAttribute('aria-label', 'Bahan'); b.innerHTML = `<img class="chip-image" alt="Gambar bahan" src="${c.src}"><i>cancel</i>`; $('chips').appendChild(b); }
}
function renderAssets() {
  $('assets').innerHTML = '';
  const q = ($('psearch').value || '').toLowerCase();
  if (mentionMode) {
    for (const n of CHARACTERS.filter(n => n.toLowerCase().includes(q))) {
      const b = document.createElement('button'); b.setAttribute('role', 'option'); b.className = 'asset-item';
      b.innerText = n + '\n' + LG.character;
      b.onclick = () => {
        const ed = $('ed'); ed.innerText = ed.innerText.replace(/@$/, '');
        const sp = document.createElement('span'); sp.className = 'mention'; sp.setAttribute('contenteditable', 'false'); sp.textContent = '@' + n;
        ed.appendChild(sp); window.__mentions.push(n); mentionMode = false; $('panel').style.display = 'none'; $('psearch').value = '';
        ed.focus(); const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      };
      $('assets').appendChild(b);
    }
    return;
  }
  for (const a of [...assets].reverse().filter(a => a.name.toLowerCase().includes(q))) {
    const b = document.createElement('button'); b.setAttribute('role', 'option'); b.className = 'asset-item';
    b.innerText = (a.busy ? LG.uploading + '\n' : '') + a.name + '\nImage';
    b.onclick = () => { if (a.busy) return; chips = [{ src: a.src }]; renderChips(); $('panel').style.display = 'none'; };
    $('assets').appendChild(b);
  }
}
$('psearch').addEventListener('input', renderAssets);
$('ed').addEventListener('input', () => {
  if (/@$/.test($('ed').innerText.replace(/\n$/, ''))) { mentionMode = true; $('panel').style.display = 'block'; renderAssets(); $('psearch').focus(); }
});
let assets = [];
function upd() {
  const r = document.querySelector('[data-g=res][aria-checked=true]').innerText.trim();
  const d = document.querySelector('[data-g=dur][aria-checked=true]').innerText.trim();
  const n = parseInt(document.querySelector('[data-g=n][aria-checked=true]').innerText.match(/\d+/)[0]);
  $('cred').textContent = Math.round((r === '360p' ? 0.75 : 1.5) * parseInt(d) * n) + ' ' + LG.credits;
  $('chiptxt').textContent = 'Video · ' + r + ' · ' + d; $('chipn').textContent = 'x' + n;
}
document.querySelectorAll('[role=radio]').forEach(b => b.onclick = () => { document.querySelectorAll('[data-g=' + b.dataset.g + ']').forEach(x => x.setAttribute('aria-checked', 'false')); b.setAttribute('aria-checked', 'true'); upd(); });
$('chip').onclick = () => $('pop').classList.toggle('open');
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('pop').classList.remove('open'); $('menu').classList.remove('open'); $('sub').classList.remove('open'); } });
$('plus').onclick = () => { mentionMode = false; $('panel').style.display = 'block'; renderAssets(); };
$('pclose').onclick = () => { mentionMode = false; $('panel').style.display = 'none'; };
$('upl').onclick = () => $('f').click();
$('f').onchange = e => {
  const f = e.target.files[0]; const a = { name: f.name, src: img('#' + ((++assetN * 97531) % 0xffffff).toString(16).padStart(6, '0')), busy: true };
  assets.push(a); cards.unshift({ type: 'user', id: 'u' + assetN, src: a.src, title: f.name }); renderAssets(); renderGrid();
  setTimeout(() => { a.busy = false; renderAssets(); }, 900); e.target.value = '';
};
$('clr').onclick = () => { $('ed').innerText = ''; };

function finish(id) {
  const c = cards.find(x => x.id === id); if (!c) return;
  finishCount++;
  if (finishCount <= FAILN) { c.type = 'fail'; c.msg = LG.failMsg; }
  else { c.type = 'video'; c.src = img('hsl(' + ((++vidCount) * 47 % 360) + ',55%,40%)'); c.title = 'Fashion product review video pro…'; window.__generated++; }
  renderGrid();
}
$('gen').onclick = () => {
  const needChip = P.get('nochips') !== '1';
  if ((needChip && !chips.length) || !$('ed').innerText.trim()) return;
  window.__lastGen = { chip: $('chiptxt').textContent + ' ' + $('chipn').textContent, prompt: $('ed').innerText, chips: chips.length };
  const id = 'g' + (++gc);
  cards.unshift({ type: 'proc', id }); chips = []; $('ed').innerText = ''; renderChips(); renderGrid();
  if (P.get('captcha') === '1' && gc === 1) { const d = document.createElement('div'); d.id = 'cap'; d.innerHTML = '<iframe src="https://www.google.com/recaptcha/api2/bframe" style="width:400px;height:500px;background:#fff"></iframe>'; document.body.appendChild(d); }
  setTimeout(() => finish(id), DELAY);
};

// detail
function route() {
  const m = location.hash.match(/^#\/edit\/(.+)$/);
  const home = location.hash === '#/home';
  $('home').style.display = home ? 'block' : 'none';
  $('project').style.display = (m || home) ? 'none' : 'block'; $('detail').style.display = m ? 'block' : 'none';
  if (!m && !home) renderGrid();
}
$('newproj').onclick = () => { window.__projectsCreated++; document.querySelector('[aria-label="Teks yang dapat diedit"]').value = 'Okt 02 - 11:17'; cards = []; location.hash = '#/project/new-' + window.__projectsCreated; };
window.addEventListener('hashchange', route);
$('back').onclick = () => { location.hash = ''; };
$('more').onclick = () => { $('menu').classList.toggle('open'); };
$('m-dl').onclick = () => { $('sub').classList.toggle('open'); };
$('m-del').onclick = () => { window.__forbidden++; };
$('m-share').onclick = () => { window.__forbidden++; };
$('m-fav').onclick = () => { window.__forbidden++; };
$('up').onclick = () => { window.__forbidden++; };
$('upg').onclick = e => { e.preventDefault(); window.__forbidden++; };
$('orig').onclick = () => {
  const bytes = new Uint8Array(40000); bytes.set([0, 0, 0, 24, 0x66, 0x74, 0x79, 0x70, 0x69, 0x73, 0x6f, 0x6d]); for (let i = 12; i < bytes.length; i++) bytes[i] = i % 251;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes], { type: 'video/mp4' })); a.download = 'video-' + Date.now() + '.mp4';
  document.body.appendChild(a); a.click(); a.remove(); window.__downloads++;
  $('menu').classList.remove('open'); $('sub').classList.remove('open');
};
function applyLang() {
  if (LANG !== 'en') return;
  const A = (sel, attr, v) => { const e = document.querySelector(sel); if (e) { if (attr === 'text') e.textContent = v; else if (attr === 'html') e.innerHTML = v; else e.setAttribute(attr, v); } };
  A('#newproj', 'text', 'New project');
  A('[aria-label="Teks yang dapat diedit"]', 'aria-label', 'Editable text');
  A('[aria-label="Opsi lainnya untuk project"]', 'aria-label', 'More options for the project');
  A('[aria-label="Menu tambahkan media"]', 'aria-label', 'Add media menu');
  A('#clr', 'aria-label', 'Clear prompt');
  A('#plus', 'aria-label', 'Add ingredients to the prompt box');
  A('#agentbtn', 'text', 'Agent');
  A('#chip', 'aria-label', 'Settings trigger');
  A('#gen', 'aria-label', 'Start generation');
  A('#back', 'aria-label', 'Back button to go to previous page');
  A('#more', 'aria-label', 'More options');
  A('video.main-video', 'aria-label', 'Generated video');
  A('#detail [aria-label="Gunakan kembali perintah"]', 'aria-label', 'Reuse prompt');
  A('#m-fav', 'html', 'favorite<br>Favourite'); A('#m-share', 'html', 'share<br>Share media');
  A('#m-dl', 'html', 'download<br>Download media'); A('#m-del', 'html', 'delete<br>Move to bin');
  A('#sub [role=menuitem]:first-child', 'html', '270p<br>Animated GIF'); A('#orig', 'html', '360p<br>Original size'); A('#up', 'html', '720p<br>Upscaled');
  A('#model', 'aria-label', 'Select model family');
  A('#pclose', 'aria-label', 'Close'); A('#psearch', 'aria-label', 'Search assets'); A('#psearch', 'placeholder', 'Search assets');
  const map = { 'Gambar': 'Image', 'Frame': 'Frames', 'Bahan': 'Ingredients', '4 dtk': '4s', '6 dtk': '6s', '8 dtk': '8s', '10 dtk': '10s' };
  document.querySelectorAll('[role=radio]').forEach(b => { const n = [...b.childNodes].reverse().find(x => x.nodeType === 3); if (n && map[n.textContent.trim()]) n.textContent = map[n.textContent.trim()]; });
  const pr = document.querySelector('#pop p'); if (pr) pr.innerHTML = 'Generating will use <a href="#" id="cred">12 credits</a>';
  document.documentElement.lang = 'en';
}
applyLang(); upd(); renderGrid(); route();
</script></body></html>
